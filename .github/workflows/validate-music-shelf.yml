name: Validate music shelf
on:
  push:
    branches: [master, 'refactor/music-shelf-*']
  pull_request:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: music-shelf-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Build with GitHub Pages Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Check pages, music catalog and local links
        run: python3 scripts/check_site.py
      - name: Upload reviewable static site
        uses: actions/upload-artifact@v4
        with:
          name: werogue-preview
          path: _site/
          retention-days: 7
          if-no-files-found: error
      - name: Report public website and cover availability
        if: github.event_name == 'push'
        env:
          VERIFY_LIVE: ${{ github.ref == 'refs/heads/master' && '1' || '0' }}
        run: python3 scripts/check_external.py
      - name: Save external verification report
        if: always() && github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: werogue-external-review
          path: external-review/
          retention-days: 7
          if-no-files-found: warn
