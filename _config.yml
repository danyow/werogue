title: "We🧞Rogue"
name: "danyow"
description: "收好喜欢的歌、它的封面，还有当时的一两句话。"
url: "https://www.werogue.com"
baseurl: ""
repository: "danyow/werogue"
locale: "zh-CN"
# Keep legacy GitHub Pages date-based URLs; daily posts have explicit permalinks.
timezone: "Etc/UTC"
remote_theme: "mmistakes/minimal-mistakes@4.28.1"
minimal_mistakes_skin: "dark"
markdown: kramdown
highlighter: rouge
kramdown:
  input: GFM
plugins:
  - jekyll-remote-theme
  - jekyll-feed
  - jekyll-sitemap
  - jekyll-redirect-from
plugins_dir: []
safe: true
future: false
strict_front_matter: true
sass:
  style: compressed
exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
  - node_modules
  - _site
  - _plugins
  - scripts
  - .github
  - .bundle
  - .gitignore
  - build-check.json
  - external-review
  - assets/fonts
defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      comments: false
# OAuth secrets and obsolete third-party comment/analytics settings are not used.
